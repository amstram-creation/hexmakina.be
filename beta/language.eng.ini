[card_1]
aecon = "shutterstock_202454893_1_people_team.png"
title = "express"
subtitle = "planning"
author = "Sammy Dieleman"
timestamp = "2018.01.01"
quote = "Why don’t we just call plans what they really are: guesses"
quote_author = "Fried &amp; Heinemeier"
content = "


<p>It's been said over and over, planning is the <strong>most fundamental</strong> part of the software development process; and <strong>it all starts with you, only you and always you</strong>.</p>

<div class="image"><img src="_ui/aecons/shutterstock_218641882_4_two_people_network.png" alt="binary code" /></div>
<p>As <strong>we listen</strong> to your issues, needs and dreams; ideas forms in back of our heads, some of them are <strong>solutions, systems, engines that will drive you</strong> to your objectives.</p>
<p>And, to paraphrase Charles Wright, <em>once you've expressed yourself, with your full capabilities, we will be leaving the facilities, get straight and meditate</em>.</p>


<div class="image"><img src="_ui/aecons/shutterstock_218641882_9_laptop_graphs.png" alt="binary code" /></div>
<p>When we think we have understood your goals &mdash;and confirmed technical feasability&mdash; we roughly estimate budget and deadlines as well as required technologies and resources.</p>
<p>We share these projections with you, through a well-formed, non-technical, intelligible document, <strong>a statement of our understanding of your purpose</strong>.</p>
<p>Your approval will trigger the next phase: complete technical analysis or, as we rather call it: dissection.</p>
"

[card_2]
aecon = "shutterstock_202503268_1_cognition_mecanic.png"
title = "dissect"
subtitle = "analysis"
author = "Sammy Dieleman"
timestamp = "06/16/2015"
quote = "Analysis without numbers is only an opinion"
quote_author = "Akin's 1st law of Spacecraft Design"
content = "
<p>Dissection is the <strong>most important</strong> part of the whole process, where we unravel the complexity of your daily tasks, where we identify, quantify and qualify data, it's emanation, it's flow, it's destination, it's purpose.</p>

<div class="image"><img src="_ui/aecons/shutterstock_202503268_7_blob.png" alt="binary code" /></div>
<p>To fully capture your ecosystem, we interview it's actors, observe their tools, documents and processes; and sometimes, we participate for a moment, for a few hours, for a day, for as long as it is needed;</p>
<p><strong>Data is everything</strong> to a computer, but we are not robots, we believe that <strong>people are everything</strong>; and we will not let them serve the data, we will provide the necessary tools to master and use data effortlessly.</p>

<div class="image"><img src="_ui/aecons/shutterstock_202454893_9_cybernetics.png" alt="binary code" /></div>
<p>Once we have a working model of the existing physical system, our investigation is completed, and we derive a logical and conceptual model of the new system, based on users requirements and create ubiquitous lexicon, leading to a common language for the developpers and the end-users.</p>
<p>A more precise evaluation of the costs (modeling, developping and transition) as well as the benefits (reduction of operational costs and time, improvements to customer satisfaction and employee morale) of alternatives solutions.</p>
<p>Depending on your constraints and preferences, you will choose the best option.</p>
"

[card_3]
aecon = "shutterstock_202454893_8_heart_connected.png"
title = "design"
subtitle = "principles"
author = "Sammy Dieleman"
timestamp = "06/16/2015"
quote = "People Propose, Science Studies, Technology Conforms"
quote_author = "Donald Norman"
content = "
<p>Working up from the conceptual model -and the choices you've made- we can now draft the technical specification: design data structures, algorithms and divide the system in concise, <strong>coherent and loosely coupled components</strong> (Constantine's Law).</p>

<div class="image"><img src="_ui/aecons/shutterstock_216001777_3_binary.png" alt="Structural Design" /><strong>Structural Design</strong></div>
<p>First, the <strong>data is normalized</strong> and its <strong>relations are formalized</strong>, respectfully applying the magnificent work of E.F. Codd to provide a flexible and evolutive database model.</p>
<p>Our models can be flat, relational, hierarchical or geographical; the objectives are always the same: <strong>relevance</strong>, <strong>clarity</strong>, <strong>consistency</strong>, <strong>accessibility</strong> and <strong>cost effectiveness</strong>.</p>

<div class="image"><img src="_ui/aecons/shutterstock_202454893_2_nodes.png" alt="Functional Design" /><strong>Functional Design</strong></div>
<p>Then, the functions of the system are sorted out in two categories: <strong>sequential or interactive functions</strong>.
<ul>
<li>The sequential ones are there to backup the data, generate reports, send mail queues, etc..</li>
<li>The interactive functions are the ones replacing the papers, forms, post-its and filing cabinets. They allow the end-user to create, store and retrieve information through the user interface.</li>
</ul>
</p>
<p>This rigorous exercice rests on a few principles we've gathered along the way; our core pragmas being:</p> 
<p style="text-align:center"><strong>SOLID</strong><br/><strong>DRY</strong><br/><strong>KISS</strong></p>

<div class="image"><img src="_ui/aecons/shutterstock_203548126_5_eye.png" alt="Interface Design" /><strong>Interface Design</strong></div>
<p>Finally, the interface design, another kind of design, that rests on 3 core principles:</p>
<p style="text-align:center"><strong>ergonomy</strong><br/><strong>accessibility</strong><br/><strong>aesthetics</strong></p>
<p>Over the past 15 years we've read (and made people read) many books, standards, recommendations and testimonies; all to ensure that <strong>everyone with the will to work and learn is granted the possibilty to</strong>.</p>

<div class="image"><img src="_ui/aecons/shutterstock_202503268_2_spiral.png" alt="Art" /><strong>Signature</strong></div>
<p>We use prime numbers, the fibonacci sequence and powers of two to make our interfaces. We don't exactly know why, it feels right to the eye and bring mystic truths<br/>Art is beyond our understanding.</p>

<p><strong>A good design is easy to use, but also hard to misuse</strong>.</p>
"

[card_4]
aecon = "shutterstock_203548126_4_module.png"
title = "build"
subtitle = "craftmanship"
author = "Sammy Dieleman"
timestamp = "06/16/2015"
quote = "I wish to God these calculations had been executed by steam"
quote_author = "Charles Babbage"
content = "
<p>The implementation process starts after the new system specifications have been accepted by all the concerned parties and consists two phases:</p>

<div class="image"><img src="_ui/aecons/shutterstock_202503268_3_electricity_logic.png" alt="infrastructure" /><strong>Acquisition</strong></div>
<p><strong>Acquisition</strong> involves the purchase of packaged software and software services. While we almost exclusively work with open-source technology, any computer system relies on electricity (generated by steam ;)), silicon and sweat, the latter being the greatest cost and our daily bread.</p>
<p>We don't impose any architecture, language or service providers, you are free to choose, according to your budget, team and preferences.

<div class="image"><img src="_ui/aecons/shutterstock_218641882_1_desk.png" alt="infrastructure" /><strong>Programming</strong></div>
<p><strong>Programming</strong>, is the core of the work, mathematical poetry, the heart of the engine. The code gives life to the silicon, makes the computer an elegant tool instead of a bulk of metal, plastic and sand. We love progamming so much we made it our work.</p>
<p>Procedural or object-oriented; PHP, Ruby or shell scripts; the joy is the same, the needs are different. To every problem a solution, to each complexity a cost.</p>
<p>There is one constant in our implementations: the web. Intranets, extranets, internets, it makes no difference, the web is the platform that changed our world</p>

"

[card_5]
aecon = "shutterstock_218641882_6_four__people_network.png"
title = "assess"
subtitle = "testing"
author = "Sammy Dieleman"
timestamp = "06/16/2015"
quote = "The test of the machine is the satisfaction it gives you.<br/>There isn't any other test."
quote_author = "Robert Pirsig"
content = "
<p><strong>Testing</strong> may seem ungrateful to most programmers but it is a crucialy necessary phase, because while <strong>the computer does not make mistakes, we made the computer</strong> and we are error-prone and quite imperfect, resulting in failures and frustration for the user (and the developper).</p>
<div class="image"><img src="_ui/Clock_reversed.gif" alt="infrastructure" /><strong>0 instead of 1</strong></div>
<p>During this phase, the engine is checked for defects, tricked with corrupted data and erratic behaviors.</p>
<p>To ensure it meets quality standards, all missteps are reported, documented, fixed and then tested again</p>
<p>When the development has reached a relevant stability, a beta version is made available, for the end-users to test again, in an environment closer to the production.</p>
<p>User feedback allows everyone to confirm the reliability of the system, wheter or not it meets the initial functionnal and business requirements. Also, the last remaining bugs usually appear during this phase.</p>
"

[card_6]
aecon = "shutterstock_202454893_3_world_sun.png"
title = "deploy"
subtitle = "conversion"
author = "Sammy Dieleman"
timestamp = "06/16/2015"
quote = "Regardless of your plans, production is the ultimate testing environment"
quote_author = "T.J. Wall"
content = "
<p>Once the system has been successfully tested and approved by all entities, comes the last part of the process: deployment and conversion.</p>
<p>The users have to be trained, the new system integrated within the organisational workflow.</p>
<p>It is not unusual to keep the old system running in parallel, until everything works flawlessly and the users are confident enough to let it go.</p>
<p>At this stage, documentation is released, it includes:
<ul>
<li>the overall workflow,</li> 
<li>the design of the engine,</li>
<li>the formats of input and outputs,</li>
<li>the training manual and directions for solving problems or breakdowns,</li>
<li>the deployment and conversion materials</li>
</ul>
</p>
<p>Deployment can be executed or supervised by us. As always, we do not exert power or coerce anyone, we are free-minded people and we dare believe in integrity, even in this world of business wolves.</p>
<p>We are not afraid</p>
"
